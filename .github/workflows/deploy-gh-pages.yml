# Serves the ready-built gh-pages branch with GitHub Pages while Pages is set
# to "GitHub Actions". Builds nothing; once Pages serves gh-pages directly
# (Settings → Pages → Deploy from a branch → gh-pages), this is not needed.
name: Deploy gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
